name: Collector regression tests
on:
  workflow_dispatch:
  push:
    branches: [main, fix/remaining-menu-collectors]
    paths: ['RU-AI-GETTER/**', 'UFRGS/**', 'tests/**', 'menu_http.rb', 'test_menu_http.rb', 'UFPR.rb', 'UFPR/**', 'UFABC.rb', '.github/workflows/collector_tests.yml', '.github/workflows/daily_menu.yml']
  pull_request:
    paths: ['RU-AI-GETTER/**', 'UFRGS/**', 'tests/**', 'menu_http.rb', 'test_menu_http.rb', 'UFPR.rb', 'UFPR/**', 'UFABC.rb', '.github/workflows/collector_tests.yml', '.github/workflows/daily_menu.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pdfplumber==0.11.9
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
      - run: ruby UFRGS/test_menu_dates.rb
      - run: ruby UFPR/test_source_http.rb
      - run: gem install nokogiri --no-document
      - run: ruby UFPR/test_menu_parser.rb
      - run: |
          ruby -c UFRGS/UFRGS.rb
          ruby -c UFPR.rb
          ruby -c UFABC.rb
      - name: Verify UFPR source with complete TLS chain
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        run: |
          ruby -r ./UFPR/source_http -rnokogiri -rbase64 -e '$stdout.sync = true; puts "Starting verified UFPR request"; html = UfprSource.get("https://p4e.ufpr.br/ru/cardapio-ru-central/"); puts "Received #{html.bytesize} bytes"; doc = Nokogiri::HTML(html); puts "Tables: #{doc.css("figure.wp-block-table").size}"; body = doc.css("p,figure.wp-block-table").select { |n| n.name == "figure" || n.css("strong").any? }.map(&:to_html).join("\n"); Base64.strict_encode64(body).scan(/.{1,120}/).each { |line| puts "UFPR_CHUNK=#{line}" }'
