name: Daily menu update

on:
  schedule:
    # Existing UFPR/UFABC update, twice daily.
    - cron: '0 12,0 * * *'
    # UTFPR: Monday at 12:00 and Tuesday at 10:00 (America/Sao_Paulo).
    - cron: '0 15 * * 1'
    - cron: '0 13 * * 2'
  push:
    branches: [main]
    paths: ['UFPR.rb', 'UFPR/**', 'UTFPR/**', '.github/workflows/daily_menu.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Workflow target
        required: true
        default: all
        type: choice
        options:
          - all
          - daily
          - ufpr
          - utfpr

      ufpr_dry_run:
        description: Validate UFPR without database writes
        required: false
        default: false
        type: boolean

jobs:
  update-database:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 12,0 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'daily' || inputs.target == 'ufpr'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    
    timeout-minutes: 15
    concurrency:
      group: ufpr-menu-scraper
      cancel-in-progress: false

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.1

    - name: Install UFPR dependencies
      run: gem install nokogiri firebase --no-document

    - name: Validate UFPR certificate trust
      run: ruby UFPR/test_source_http.rb

    - name: Validate UFPR parser
      run: ruby UFPR/test_menu_parser.rb

    - name: Get UFPR menus
      id: ufpr
      env:
        FIREBASE_KEY: ${{ secrets.SECRET }} 
        BASE_URL: ${{ secrets.BASE_URI }}
      run: ruby UFPR.rb --output ufpr-menus.json ${{ inputs.ufpr_dry_run && '--dry-run' || '' }}
      timeout-minutes: 10

    - name: Save collected UFPR menus
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ufpr-menus
        path: |
          ufpr-menus.json
          ufpr_pending.md
          ufpr_failures.md
        if-no-files-found: ignore
        retention-days: 7

    - name: Maintain one issue for active UFPR failures
      if: always() && steps.ufpr.outcome != 'skipped' && !inputs.ufpr_dry_run
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const title = '⚠️ UFPR Scraper: active failures';
          const label = 'scraper-failure';
          const repo = context.repo;
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            ...repo, state: 'open', labels: label, per_page: 100
          });
          const issue = issues.find(item => !item.pull_request && item.title === title);
          if (fs.existsSync('ufpr_failures.md')) {
            const body = fs.readFileSync('ufpr_failures.md', 'utf8').trim();
            if (issue) {
              if ((issue.body || '').trim() !== body) {
                await github.rest.issues.update({...repo, issue_number: issue.number, body});
              }
            } else {
              try {
                await github.rest.issues.getLabel({...repo, name: label});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...repo, name: label, color: 'D93F0B', description: 'Automated alert from scraper'
                });
              }
              await github.rest.issues.create({...repo, title, body, labels: [label]});
            }
          } else if (issue && '${{ steps.ufpr.outcome }}' === 'success') {
            await github.rest.issues.update({...repo, issue_number: issue.number, state: 'closed'});
          }

    # - name: Get UFRGS menus
    #   env:
    #     FIREBASE_KEY: ${{ secrets.SECRET }} 
    #     BASE_URL: ${{ secrets.BASE_URI }}
    #   run: ruby UFRGS.rb
    #   continue-on-error: true

    # - name: Add today's menu to firestore
    #   env:
    #     FIREBASE_KEY: ${{ secrets.SECRET }} 
    #     BASE_URL: ${{ secrets.BASE_URI }}
    #     GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
    #   run: ruby movedata_today.rb

  update-ufabc:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 12,0 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'daily'))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ufabc-menu-scraper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
      - run: gem install nokogiri firebase --no-document
      - name: Validate UFABC HTTP retries
        run: ruby UFABC/test_source_http.rb
      - name: Collect UFABC menus
        env:
          FIREBASE_KEY: ${{ secrets.SECRET }}
          BASE_URL: ${{ secrets.BASE_URI }}
        run: ruby UFABC.rb
        timeout-minutes: 3

  update-utfpr:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' &&
        (github.event.schedule == '0 15 * * 1' || github.event.schedule == '0 13 * * 2')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'utfpr'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: utfpr-menu-scraper
      cancel-in-progress: false

    defaults:
      run:
        working-directory: UTFPR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: UTFPR/requirements.txt

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate UTFPR menu schema
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Download, process and upload UTFPR menus
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_KEY: ${{ secrets.SECRET }}
          BASE_URL: ${{ secrets.BASE_URI }}
        run: python main.py
