name: Daily menu update

on:
  schedule:
    # Existing UFPR/UFABC update, twice daily.
    - cron: '0 12,0 * * *'
    # UTFPR: Monday at 12:00 and Tuesday at 10:00 (America/Sao_Paulo).
    - cron: '0 15 * * 1'
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      target:
        description: Workflow target
        required: true
        default: all
        type: choice
        options:
          - all
          - daily
          - ufpr
          - utfpr

      ufpr_dry_run:
        description: Validate UFPR without database writes
        required: false
        default: false
        type: boolean

jobs:
  update-database:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 12,0 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'daily' || inputs.target == 'ufpr'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    
    timeout-minutes: 15
    concurrency:
      group: ufpr-menu-scraper
      cancel-in-progress: false

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.1

    - name: Install UFPR dependencies
      run: gem install nokogiri firebase --no-document

    - name: Validate UFPR certificate trust
      run: ruby UFPR/test_source_http.rb

    - name: Validate UFPR parser
      run: ruby UFPR/test_menu_parser.rb

    - name: Get UFPR menus
      id: ufpr
      env:
        FIREBASE_KEY: ${{ secrets.SECRET }} 
        BASE_URL: ${{ secrets.BASE_URI }}
      run: ruby UFPR.rb --output ufpr-menus.json ${{ inputs.ufpr_dry_run && '--dry-run' || '' }}
      timeout-minutes: 10

    - name: Save collected UFPR menus
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ufpr-menus
        path: ufpr-menus.json
        if-no-files-found: ignore
        retention-days: 7

    - name: Notify UFPR scraping failures via GitHub Issue
      if: always() && steps.ufpr.outputs.has_failures == 'true' || hashFiles('ufpr_failures.md') != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ ! -f ufpr_failures.md ]; then
          echo "No failure report found. Skipping issue creation."
          exit 0
        fi
        gh label create "scraper-failure" --color "D93F0B" --description "Automated alert from scraper" 2>/dev/null || true
        TITLE="⚠️ UFPR Scraper: partial failure — $(date -u +'%Y-%m-%d')"
        BODY=$(cat ufpr_failures.md)
        gh issue create --title "$TITLE" --body "$BODY" --label "scraper-failure"

    # - name: Get UFRGS menus
    #   env:
    #     FIREBASE_KEY: ${{ secrets.SECRET }} 
    #     BASE_URL: ${{ secrets.BASE_URI }}
    #   run: ruby UFRGS.rb
    #   continue-on-error: true

    # - name: Add today's menu to firestore
    #   env:
    #     FIREBASE_KEY: ${{ secrets.SECRET }} 
    #     BASE_URL: ${{ secrets.BASE_URI }}
    #     GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
    #   run: ruby movedata_today.rb

  update-ufabc:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 12,0 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'daily'))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ufabc-menu-scraper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
      - run: gem install nokogiri firebase --no-document
      - name: Validate UFABC HTTP retries
        run: ruby UFABC/test_source_http.rb
      - name: Collect UFABC menus
        env:
          FIREBASE_KEY: ${{ secrets.SECRET }}
          BASE_URL: ${{ secrets.BASE_URI }}
        run: ruby UFABC.rb
        timeout-minutes: 3

  update-utfpr:
    if: >-
      (github.event_name == 'schedule' &&
        (github.event.schedule == '0 15 * * 1' || github.event.schedule == '0 13 * * 2')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'utfpr'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: utfpr-menu-scraper
      cancel-in-progress: false

    defaults:
      run:
        working-directory: UTFPR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: UTFPR/requirements.txt

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate UTFPR menu schema
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Download, process and upload UTFPR menus
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_KEY: ${{ secrets.SECRET }}
          BASE_URL: ${{ secrets.BASE_URI }}
        run: python main.py
