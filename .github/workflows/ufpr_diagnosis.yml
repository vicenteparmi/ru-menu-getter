name: UFPR source diagnosis
on:
  push:
    branches: [fix/ufpr-recurring-alerts]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
      - run: gem install nokogiri --no-document
      - run: gem install firebase --no-document
      - run: ruby UFPR/test_menu_parser.rb
      - name: Validate live sources without database writes
        run: ruby UFPR.rb --dry-run --output ufpr-menus.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufpr-validation
          path: |
            ufpr-menus.json
            ufpr_pending.md
            ufpr_failures.md
