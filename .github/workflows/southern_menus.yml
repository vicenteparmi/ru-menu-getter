name: UFSC menu update
on:
  schedule:
    - cron: '35 10,18 * * 1-6'
  workflow_dispatch:
    inputs:
      upload:
        description: Publish validated menus to Firebase
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ufsc-menus
  cancel-in-progress: false
jobs:
  ufsc:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        campus: [blumenau, cca, curitibanos, joinville, trindade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pdfplumber==0.11.9 pillow pytesseract
      - if: matrix.campus == 'blumenau'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-por
      - name: Collect and validate UFSC
        env:
          BASE_URL: ${{ secrets.BASE_URI }}
          FIREBASE_KEY: ${{ secrets.SECRET }}
          CAMPUS: ${{ matrix.campus }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: |
          if [ "$PUBLISH" = true ]; then
            python RU-AI-GETTER/collect_weekly_menus.py "$CAMPUS" --upload
          else
            python RU-AI-GETTER/collect_weekly_menus.py "$CAMPUS"
          fi
