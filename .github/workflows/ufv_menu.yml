name: Unicamp diagnostic (read only)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
      - run: gem install nokogiri --no-document
      - run: ruby test_unicamp.rb
      - run: ruby UNICAMP.rb --dry-run
